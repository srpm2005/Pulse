spring.application.name=pulse
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.datasource.url=jdbc:postgresql://${NEON_HOST:neon-host}/${NEON_DB:db}?sslmode=require
spring.datasource.username=${NEON_USER:neon-user}
spring.datasource.password=${NEON_PASSWORD:neon-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:placeholder-random-base64-256bit-key-must-be-updated}
jwt.expiration-ms=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:your-email@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

alert.scheduler.cron=0 */2 3-10 * * MON-FRI

server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

spring.main.lazy-initialization=true
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Quantitative Research Assistant & RAG LLM Settings (Powered exclusively by Google Gemini)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

research.system.prompt=${RESEARCH_SYSTEM_PROMPT:You are the Pulse Quantitative Research Assistant, an institutional-grade algorithmic equity researcher.}


